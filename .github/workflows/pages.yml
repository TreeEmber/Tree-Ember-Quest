name: Deploy Tree & Ember V70

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write
  actions: read

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout approved public site
        uses: actions/checkout@v4
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Upload static site
        uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - name: Wait until exactly one Pages upload is available
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          for attempt in $(seq 1 24); do
            count=$(gh api "/repos/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}/artifacts" --jq '[.artifacts[] | select(.name == "github-pages" and (.expired | not))] | length')
            if [[ "$count" == "1" ]]; then
              echo "GitHub Pages artifact is registered."
              exit 0
            fi
            if [[ "$count" != "0" ]]; then
              echo "::error::Expected one Pages artifact, found $count."
              exit 1
            fi
            echo "Pages artifact not visible yet (attempt $attempt)."
            sleep 5
          done
          echo "::error::Pages artifact registration timed out."
          exit 1
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
