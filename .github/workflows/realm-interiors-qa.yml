name: Living Tree Hub interior QA
on:
  push:
    branches: [feature/hub-interiors-living-tree-20261117]
    paths:
      - index.html
      - assets/realm-interiors.css
      - assets/realm-interiors.js
      - scripts/test_realm_interiors.mjs
      - scripts/test_living_legends.mjs
      - assets/living-legends.js
      - .github/workflows/realm-interiors-qa.yml
  pull_request:
    branches: [main]
    paths:
      - index.html
      - assets/realm-interiors.css
      - assets/realm-interiors.js
      - scripts/test_realm_interiors.mjs
      - .github/workflows/realm-interiors-qa.yml
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  visitor-realms:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Chromium browser test tools
        run: |
          npm install --no-save playwright@1.56.0
          npx playwright install --with-deps chromium
      - name: Check original and new assets
        run: |
          test -s index.html
          test -s assets/portal-hub-gemini-softloop.mp4
          test -s assets/realm-interiors.css
          test -s assets/realm-interiors.js
          test -s oaken-emporium.html
      - name: Run local full-site acceptance
        run: |
          python3 -m http.server 8177 --bind 127.0.0.1 >/tmp/realm-http.log 2>&1 &
          sleep 2
          node scripts/test_realm_interiors.mjs
      - name: Run Living Legends atlas acceptance
        run: node scripts/test_living_legends.mjs
      - name: Store four-screen-size screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tree-ember-realm-screenshots
          path: |
            qa-realm-*.png
            qa-legend-*.png
          if-no-files-found: ignore
