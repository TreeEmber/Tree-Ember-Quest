name: Oaken Emporium Hub visual and interaction QA
on:
  push:
    branches: [fix/hub-the-hollow-portal-20261116, feature/hub-gemini-ambient-20261116]
    paths:
      - index.html
      - oaken-emporium.html
      - assets/portal-hub-gemini-poster.jpg
      - assets/portal-hub-gemini-ambient.mp4
      - assets/portal-hub-gemini-softloop.mp4
      - assets/oaken-emporium-tree-shops.webp
      - scripts/test_oaken_hub.mjs
      - scripts/verify_gemini_hub_media.py
      - .github/workflows/oaken-hub-qa.yml
  pull_request:
    branches: [main]
    paths:
      - index.html
      - oaken-emporium.html
      - scripts/test_oaken_hub.mjs
      - scripts/verify_gemini_hub_media.py
      - .github/workflows/oaken-hub-qa.yml
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  visual-qa:
    runs-on: ubuntu-24.04
    timeout-minutes: 16
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install headless browser tools
        run: |
          npm install --no-save playwright@1.56.0
          npx playwright install --with-deps chromium
      - name: Verify source assets present
        run: |
          test -s index.html
          test -s oaken-emporium.html
          test -s assets/portal-hub-gemini-poster.jpg
          test -s assets/portal-hub-gemini-ambient.mp4
          test -s assets/portal-hub-gemini-softloop.mp4
          test -s assets/oaken-emporium-tree-shops.webp
          command -v ffprobe || (sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg)
          python3 scripts/verify_gemini_hub_media.py
      - name: Start local website and test
        run: |
          python3 -m http.server 8177 --bind 127.0.0.1 >/tmp/oaken-hub-server.log 2>&1 &
          sleep 2
          node scripts/test_oaken_hub.mjs
      - name: Save QA screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: oaken-hub-screenshots
          path: qa-oaken-hub-*.png
          if-no-files-found: ignore
